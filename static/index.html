<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf8f6"><title>骨科专科智能规划 · ORTHO LAB</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="app" v-cloak>
<aside class="sidebar">
  <a class="brand" href="#" @click.prevent="go('new')"><span class="brand-symbol"><icon name="cross"></icon></span><span>ORTHO<span class="brand-light">LAB</span><small>骨科专科智能规划</small></span></a>
  <span class="nav-label">专科规划工作台</span>
  <nav aria-label="主导航"><button :class="['nav-item',{active:view==='new'}]" @click="go('new')"><icon name="grid"></icon>规划工作台<icon name="chevron" class="nav-arrow"></icon></button><button :class="['nav-item',{active:view!=='new'}]" @click="showCases"><icon name="folder"></icon>病例与方案<span class="nav-count">{{ cases.length }}</span></button></nav>
  <div class="sidebar-help"><span class="help-symbol"><icon name="shield"></icon></span><strong>每一步，皆可追溯</strong><p>从测量参数到复核结论，<br>让规划过程清晰可见。</p><span class="local-indicator"><i></i>本地数据存储</span></div>
  <div class="sidebar-footer"><span class="avatar">研</span><span>教学演示工作区<small>ORTHO / RESEARCH</small></span></div>
</aside>
<div class="main-shell"><header class="topbar"><div class="breadcrumb">工作台<span>/</span><strong>{{ view==='new'?'新建规划':view==='cases'?'病例档案':'方案详情' }}</strong></div><div class="topbar-right"><span class="online-dot"></span>本地工作区<span class="demo-tag">教学演示</span></div></header><main>
<template v-if="view==='new'">
  <section class="hero"><div class="hero-copy"><span class="eyebrow"><i></i> ORTHOPEDIC PLANNING</span><h1>让每一次规划，<br>更清晰一步<span>。</span></h1><p>面向脊柱、关节与创伤的专科规划工作台。<br>连接测量、方案与人工复核。</p><div class="hero-tags"><span><icon name="spark"></icon>可解释规则</span><span><icon name="shield"></icon>全流程留痕</span><span><icon name="report"></icon>报告归档</span></div></div><div class="hero-art"><img src="/static/assets/medical-scenarios.png" alt="脊柱、关节假体和骨折内固定器械教学模型"><div class="art-label"><span></span>三个专科场景 · 一体化规划流程</div></div></section>
  <div class="section-title"><div><span class="section-number">01</span><h2>选择专科场景</h2><span class="section-subtitle">从你的病例类型开始</span></div></div>
  <section class="scenario-grid" aria-label="规划场景"><button v-for="item in scenarios" :key="item.id" :class="['scenario-card',item.id,{selected:scenario===item.id}]" @click="changeScenario(item.id)" :aria-pressed="scenario===item.id"><span class="scenario-icon"><icon :name="item.icon"></icon></span><span class="scenario-copy"><strong>{{ item.name }}</strong><small>{{ item.subtitle }}</small></span><span class="selection-mark"><icon :name="scenario===item.id?'check':'arrow'"></icon></span></button></section>
  <div class="input-layout"><form class="surface case-form" @submit.prevent="createCase"><div class="surface-heading"><div><span class="section-number">02</span><h2>病例与测量数据</h2></div><button type="button" class="sample-button" @click="fillSample"><icon name="refresh"></icon>填入示例</button></div><div class="form-section-label">基本信息<span>仅录入匿名病例编号</span></div><div class="form-grid base-fields"><label class="code-field">病例编号 <em>*</em><input v-model.trim="form.code" placeholder="例如 DEMO-2026-001" minlength="2" maxlength="32" required></label><label>年龄 <em>*</em><div class="input-unit"><input v-model.number="form.age" type="number" min="1" max="120" required><span>岁</span></div></label><label>性别<select v-model="form.sex"><option value="female">女</option><option value="male">男</option><option value="other">其他 / 未说明</option></select></label></div><div class="form-section-label measurement-label">{{ scenarioInfo.name }}测量参数<span>请使用人工确认的测量值</span></div><div class="form-grid measure-fields"><template v-for="field in activeFields" :key="field.key"><label v-if="field.type!=='checkbox'">{{ field.label }}<select v-if="field.type==='select'" v-model="measurements[field.key]"><option v-for="o in field.options" :value="o[0]">{{ o[1] }}</option></select><div v-else class="input-unit"><input v-model.number="measurements[field.key]" type="number" :min="field.min" :max="field.max" :step="field.step||0.1" required><span>{{ field.unit }}</span></div></label><label v-else class="checkbox-row"><input v-model="measurements[field.key]" type="checkbox"><span><strong>{{ field.label }}</strong><small>纳入固定方案排序与风险提醒</small></span></label></template></div><div class="form-actions"><span><icon name="lock"></icon>数据保存在本机</span><button class="primary" type="submit" :disabled="busy">{{ busy?'正在生成方案…':'创建病例并生成方案' }}<icon name="arrow"></icon></button></div></form>
  <aside class="workflow surface"><span class="eyebrow">YOUR PLANNING JOURNEY</span><h3>从数据，到可复核的方案</h3><p class="muted">每一个结论，都保留它的依据。</p><div v-for="(step,i) in workflow" class="workflow-step"><span class="workflow-icon" :class="{mint:i%2}"><icon :name="step.icon"></icon></span><div><small>0{{ i+1 }}</small><strong>{{ step.name }}</strong><p>{{ step.desc }}</p></div></div><div class="workflow-foot"><icon name="info"></icon><p>使用教学规则与虚构器械目录。影像仅存档预览，方案需独立人工复核。</p></div></aside></div>
</template>
<template v-if="view==='cases'">
  <div class="page-heading"><div><span class="eyebrow">CASE ARCHIVE</span><h1>病例与方案</h1><p>让病例、方案版本与复核记录保持关联。</p></div><button class="primary" @click="go('new')"><icon name="plus"></icon>新建规划</button></div><div class="archive-tools"><div class="search-box"><icon name="search"></icon><input v-model="search" placeholder="搜索病例编号" aria-label="搜索病例编号"></div><div class="filter-pills"><button @click="caseFilter='all'" :class="{active:caseFilter==='all'}">全部场景</button><button v-for="s in scenarios" @click="caseFilter=s.id" :class="{active:caseFilter===s.id}">{{ s.name }}</button></div></div><div class="case-list"><button v-for="c in filteredCases" class="case-card surface" @click="safeShowDetail(c.id)"><span :class="['archive-icon',c.scenario]"><icon :name="scenarioById(c.scenario).icon"></icon></span><span class="archive-case"><strong>{{ c.code }}</strong><small>{{ c.scenario_label }} · {{ c.age }} 岁 · {{ sexLabel(c.sex) }}</small></span><span class="archive-date">{{ formatTime(c.created_at) }}<small>{{ c.plan_count }} 个方案版本</small></span><span :class="['status-badge',c.latest_plan_status||'pending']">{{ statusLabel(c.latest_plan_status||'pending') }}</span><icon name="arrow"></icon></button><div v-if="!filteredCases.length" class="surface empty-state"><icon name="folder"></icon><h3>这里还没有匹配的病例</h3><p>创建一条演示病例，开始你的第一个规划。</p><button class="primary" @click="go('new')">新建病例<icon name="arrow"></icon></button></div></div>
</template>
<template v-if="view==='detail' && detail">
  <div class="detail-top"><button class="back-button" @click="showCases"><icon name="back"></icon>返回病例档案</button><div class="detail-tools"><select v-if="detail.plans.length" v-model="selectedPlanId" aria-label="切换方案版本"><option v-for="(p,i) in detail.plans" :value="p.id">版本 {{ detail.plans.length-i }} · {{ statusLabel(p.status) }}</option></select><button class="soft-button" @click="reanalyze" :disabled="busy"><icon name="refresh"></icon>生成新版本</button><a v-if="plan" class="primary" :href="'/api/plans/'+plan.id+'/export'" target="_blank" rel="noopener"><icon name="report"></icon>导出报告</a></div></div>
  <div class="page-heading detail-heading"><div><span class="eyebrow">{{ scenarioById(detail.case.scenario).english }}</span><h1>{{ detail.case.code }}<span :class="['status-badge',plan?.status||'pending']">{{ statusLabel(plan?.status||'pending') }}</span></h1><p>{{ detail.case.scenario_label }} · {{ detail.case.age }} 岁 · {{ sexLabel(detail.case.sex) }}<span class="meta-space">{{ formatTime(detail.case.created_at) }}</span></p></div></div>
  <div v-if="!plan" class="surface empty-state"><h3>病例已保存，尚未生成方案</h3><button class="primary" @click="reanalyze" :disabled="busy">生成方案</button></div>
  <div v-else class="detail-layout"><div class="detail-main">
    <section class="plan-overview"><div class="overview-icon"><icon :name="scenarioById(detail.case.scenario).icon"></icon></div><div class="overview-copy"><span class="eyebrow">PLANNING OVERVIEW</span><h2>{{ result.title }}</h2><p>{{ result.summary }}</p></div><div class="metric-grid"><div v-for="m in result.metrics"><small>{{ m.label }}</small><strong>{{ m.value }}</strong></div></div></section>
    <section class="surface options-panel"><div class="panel-title"><h2>候选方案对比</h2><span class="soft-tag">{{ result.ranked_options.length }} 个候选</span></div><p class="muted panel-intro">按当前输入与教学规则排序，查看候选的得分与依据。</p><article v-for="(o,i) in result.ranked_options" :class="['option-row',{top:i===0}]"><span class="option-rank">0{{ i+1 }}</span><div class="option-body"><div class="option-title"><h3>{{ o.name }}</h3><span v-if="i===0" class="recommend-tag">规则首选</span><strong class="option-score">{{ o.score }}<small> / 100</small></strong></div><div class="score-track"><div :style="{width:o.score+'%'}"></div></div><p>{{ o.reason }}</p><div v-if="o.deviations" class="deviation-row"><span>外径差 {{ o.deviations.diameter }} mm</span><span>髓腔差 {{ o.deviations.canal }} mm</span><span v-if="detail.case.measurements.joint_type==='hip'">偏心距差 {{ o.deviations.offset }} mm</span></div></div></article><p class="score-note"><icon name="info"></icon>{{ result.score_note||'分数用于候选方案比较，不代表临床成功率。' }}</p></section>
    <section v-if="result.sensitivity" class="surface sensitivity-panel"><div class="panel-title"><h2>参数敏感性分析</h2><span class="soft-tag mint-tag">单因素探索</span></div><p class="muted panel-intro">{{ result.sensitivity.label }}变化时，{{ result.sensitivity.metric }}如何响应？</p><div class="sensitivity-chart" role="img" :aria-label="result.sensitivity.label+'敏感性分析柱状图'"><div v-for="point in result.sensitivity.points" class="sensitivity-column"><strong>{{ point.y }}</strong><div class="bar-space"><div :style="{height:sensitivityHeight(point.y)+'%'}"></div></div><small>{{ point.x }}{{ result.sensitivity.unit }}</small></div></div><p class="small-note">当前输入 {{ result.sensitivity.baseline }}{{ result.sensitivity.unit }}。{{ result.sensitivity.note }}</p></section>
    <section class="surface explanation-panel"><div class="panel-title"><h2>规则依据与复核要点</h2><icon name="shield"></icon></div><div class="risk-note" v-for="flag in result.flags"><icon name="info"></icon><span>{{ flag }}</span></div><div class="review-checks"><span v-for="item in result.required_review"><icon name="check"></icon>{{ item }}</span></div><details><summary>查看计算过程与算法说明</summary><p v-for="item in result.calculation">{{ item }}</p><p>{{ result.method }}</p><small>{{ result.model_version }}</small></details></section>
  </div><aside class="detail-side">
    <section class="surface review-panel"><div class="panel-title"><h2>人工复核</h2><span class="round-icon"><icon name="doctor"></icon></span></div><template v-if="plan.status==='pending'"><p class="muted">核对输入与候选依据后填写结论。</p><form @submit.prevent="submitReview"><label>复核人<input v-model.trim="review.reviewer" placeholder="姓名或工号" minlength="2" maxlength="50" required></label><label>复核意见<textarea v-model.trim="review.note" placeholder="记录复核依据或需要补充的信息" minlength="2" maxlength="500" required></textarea></label><div class="review-decisions"><label :class="{chosen:review.status==='approved'}"><input v-model="review.status" type="radio" value="approved">通过</label><label :class="{chosen:review.status==='rejected'}"><input v-model="review.status" type="radio" value="rejected">退回</label></div><button class="primary full-width" :disabled="busy" type="submit"><icon name="check"></icon>{{ busy?'正在提交…':'提交复核并归档' }}</button></form></template><template v-else><div :class="['review-result',plan.status]"><icon :name="plan.status==='approved'?'check':'info'"></icon><strong>{{ statusLabel(plan.status) }}</strong></div><p class="review-author">{{ plan.reviewer }} · {{ formatTime(plan.reviewed_at) }}</p><p class="review-text">{{ plan.review_note }}</p><p class="small-note">本版本复核已归档。如需再次分析，可生成新版本。</p></template></section>
    <section class="surface image-panel"><div class="panel-title"><h2>影像附件</h2><icon name="image"></icon></div><label class="upload-zone"><input type="file" accept="image/png,image/jpeg" @change="uploadImage" :disabled="busy" aria-label="上传影像附件"><icon name="upload"></icon><strong>{{ detail.case.image_url?'替换影像附件':'点击上传影像' }}</strong><small>PNG / JPEG · 不超过 5 MB</small></label><img v-if="detail.case.image_url" class="image-preview" :src="detail.case.image_url" alt="病例影像附件"><p class="small-note">附件用于存档和人工查看，不参与自动测量或评分。</p></section>
    <section class="surface audit-panel"><div class="panel-title"><h2>操作留痕</h2><icon name="clock"></icon></div><ol class="audit-list"><li v-for="a in detail.audit"><span class="audit-dot"></span><strong>{{ auditLabel(a.action) }}</strong><p>{{ a.detail }}</p><small>{{ formatTime(a.at) }}</small></li></ol></section>
  </aside></div>
</template>
<footer class="page-footer"><span>ORTHO LAB · 骨科专科智能规划演示系统</span><span>教学演示 · 方案须经专业人员复核</span></footer>
</main></div><Transition name="toast"><div v-if="toastMessage" class="toast" role="status" aria-live="polite"><icon :name="toastError?'info':'check'"></icon>{{ toastMessage }}</div></Transition></div><script src="/static/vendor/vue.global.prod.js"></script><script src="/static/app.js"></script></body></html>
